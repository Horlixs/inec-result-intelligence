name: INEC Geography Sync

on:
  workflow_run:
    workflows: ["Deploy Supabase"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Invoke geography sync
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          echo "Syncing states, LGAs and wards..."
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/inec-geo-sync" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"mode":"hierarchy"}'

          for state_code in $(seq -w 1 37); do
            echo "Syncing polling units for state $state_code..."
            curl --fail-with-body --silent --show-error \
              -X POST "$SUPABASE_URL/functions/v1/inec-geo-sync" \
              -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"mode\":\"polling-units\",\"stateCode\":\"$state_code\"}"
          done
