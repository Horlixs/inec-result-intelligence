name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
      - ".github/workflows/inec-geo-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.117.0

      - name: Validate deployment secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply database migrations
        run: supabase db push --include-all

      - name: Configure pipeline watchdog Vault credentials
        shell: bash
        run: |
          set -euo pipefail
          API_KEYS="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json)"
          PIPELINE_KEY="$(printf '%s' "$API_KEYS" | jq -r 'map(select(.type == "secret"))[0].api_key // map(select(.type == "publishable"))[0].api_key // map(select(.name == "service_role"))[0].api_key // map(select(.name == "anon"))[0].api_key // empty')"
          test -n "$PIPELINE_KEY"

          PROJECT_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          SQL="do \\$\$\n          declare\n            project_url_id uuid;\n            pipeline_key_id uuid;\n          begin\n            select id into project_url_id from vault.decrypted_secrets where name = 'project_url' limit 1;\n            if project_url_id is null then\n              perform vault.create_secret('${PROJECT_URL}', 'project_url', 'Supabase project URL used by the IReV watchdog.');\n            else\n              perform vault.update_secret(project_url_id, '${PROJECT_URL}', 'project_url', 'Supabase project URL used by the IReV watchdog.');\n            end if;\n\n            select id into pipeline_key_id from vault.decrypted_secrets where name = 'pipeline_cron_key' limit 1;\n            if pipeline_key_id is null then\n              perform vault.create_secret('${PIPELINE_KEY}', 'pipeline_cron_key', 'API key used only by the internal IReV watchdog cron.');\n            else\n              perform vault.update_secret(pipeline_key_id, '${PIPELINE_KEY}', 'pipeline_cron_key', 'API key used only by the internal IReV watchdog cron.');\n            end if;\n          end\n          \\$\$;"

          supabase db query --linked -p "$SUPABASE_DB_PASSWORD" "$SQL"

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      # Keep the deployment workflow itself versioned so schema/worker deployments
      # are re-triggered whenever the pipeline infrastructure changes.
