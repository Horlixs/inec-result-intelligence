name: PaddleOCR Result Worker

on:
  schedule:
    - cron: "*/3 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["IReV OCR Drain"]
    types: [completed]

concurrency:
  group: paddle-ocr-result-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      PADDLE_PDX_MODEL_SOURCE: BOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Supabase service key
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$GOOGLE_GENERATIVE_AI_API_KEY"
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Using configured SUPABASE_SERVICE_ROLE_KEY."
          else
            test -n "$SUPABASE_ACCESS_TOKEN"
            test -n "$SUPABASE_PROJECT_ID"
            curl --fail --silent --show-error --location               -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"               "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys"               > /tmp/supabase-api-keys.json
            SERVICE_KEY="$(python3 -c 'import json; d=json.load(open("/tmp/supabase-api-keys.json")); keys=d if isinstance(d,list) else d.get("api_keys",d.get("keys",[])); print(next((x.get("api_key","") for x in keys if x.get("name")=="service_role" or x.get("type")=="secret"),""))')"
            test -n "$SERVICE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"
            echo "Resolved service key from the linked Supabase project."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-paddleocr.txt

      - name: Install PaddleOCR CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==3.2.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install -r requirements-paddleocr.txt

      - name: Process one queued result sheet
        run: python scripts/paddle_ocr_worker.py
