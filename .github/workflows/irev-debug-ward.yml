name: IReV Ward API Diagnostic

on:
  push:
    paths:
      - "scripts/irev-debug-ward.mjs"
      - ".github/workflows/irev-debug-ward.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IREV_API_KEY: ${{ secrets.IREV_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify IReV diagnostic credential is configured
        run: |
          if [ -z "$IREV_API_KEY" ]; then
            echo "::error::GitHub Secret IREV_API_KEY is not configured."
            exit 1
          fi
      - name: Inspect IReV LGA hierarchy and resolved ward response
        run: node scripts/irev-debug-ward.mjs
