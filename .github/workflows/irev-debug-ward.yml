name: IReV Ward API Diagnostic

on:
  push:
    paths:
      - "supabase/functions/irev-diagnose-ward/**"
      - ".github/workflows/irev-debug-ward.yml"
  workflow_run:
    workflows:
      - Deploy Supabase Edge Functions
    types:
      - completed
  workflow_dispatch:

jobs:
  inspect:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase diagnostic credentials are configured
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
      - name: Run server-side IReV diagnostic
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/irev-diagnose-ward" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"election_id":"6aae6541d0998b3b55a9af98","ward_oid":"5f0f3aee8f77bb3acad09266"}'
      - name: Probe IReV geography detail endpoints
        run: |
          base="https://dolphin-app-sleqh.ondigitalocean.app/api/v1"
          for path in \
            "/lgas/5f0f39934d89fc3a883de23a" \
            "/lga/5f0f39934d89fc3a883de23a" \
            "/lgas/3481" \
            "/lga/3481" \
            "/states/20"; do
            echo "=== $path ==="
            curl --silent --show-error --max-time 15 -w "\nHTTP=%{http_code}\n" "$base$path" | head -c 6000
            echo
          done
