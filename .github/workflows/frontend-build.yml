name: Frontend build
# Production TypeScript verification

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "index.html"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "index.html"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite build
        run: npm run build

# Build diagnostics v2
