name: IReV OCR Drain

on:
  schedule:
    # Backup worker. The IReV Refresh workflow also triggers this
    # workflow after each scheduled refresh, so OCR does not depend on a
    # second independent GitHub scheduler.
    - cron: "*/3 * * * *"
  workflow_run:
    workflows: ["IReV Refresh"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/irev-ocr-drain.yml"

concurrency:
  group: irev-ocr-drain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Drain queued OCR jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TRIGGER="manual"
          else
            TRIGGER="github-backup"
          fi

          for attempt in $(seq 1 36); do
            response=$(curl --fail-with-body --silent --show-error \
              --max-time 180 \
              -X POST "$SUPABASE_URL/functions/v1/irev-batch" \
              -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"trigger\":\"$TRIGGER\"}" ) || {
                echo "Batch request failed; retrying in 10 seconds..."
                sleep 10
                continue
              }

            echo "$response"

            busy=$(python3 - "$response" <<'PY'
import json,sys
try:
    d=json.loads(sys.argv[1])
    print("1" if d.get("busy") else "0")
except Exception:
    print("0")
PY
)
            if [ "$busy" = "0" ]; then
              break
            fi

            echo "Another worker is active. Waiting 10 seconds for the lease..."
            sleep 10
          done

          echo "$response"

          python3 - "$response" <<'PY'
import json,sys
d=json.loads(sys.argv[1])
if not d.get("ok"):
    raise SystemExit("Batch returned failure: "+str(d.get("error")))
print("PROCESSED=",d.get("processed",0),"FAILED=",d.get("failed",0),"REMAINING=",d.get("remaining",0),"SHEET_QUEUE=",d.get("remaining_sheet_jobs",0),"RATE_LIMITED=",d.get("rate_limited",False),"BUSY=",d.get("busy",False))
PY
