name: IReV OCR Drain

on:
  schedule:
    # Backup worker. The IReV Refresh workflow also triggers this
    # workflow after each scheduled refresh, so OCR does not depend on a
    # second independent GitHub scheduler.
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["IReV Refresh"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/irev-ocr-drain.yml"

concurrency:
  group: irev-ocr-drain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Drain queued OCR jobs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          response=$(curl --fail-with-body --silent --show-error \
            --max-time 180 \
            -X POST "$SUPABASE_URL/functions/v1/irev-batch" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "$response"

          python3 - "$response" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if not d.get("ok"):
              raise SystemExit("Batch returned failure: "+str(d.get("error")))
          print("PROCESSED=",d.get("processed",0),"FAILED=",d.get("failed",0),"REMAINING=",d.get("remaining",0),"SHEET_QUEUE=",d.get("remaining_sheet_jobs",0),"RATE_LIMITED=",d.get("rate_limited",False))
          PY
