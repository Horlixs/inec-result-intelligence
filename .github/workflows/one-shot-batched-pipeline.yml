name: One-shot batched pipeline patch

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch refresh worker and pipeline UI
        shell: python
        run: |
          from pathlib import Path
          import re

          refresh = Path('supabase/functions/irev-refresh/index.ts')
          s = refresh.read_text()
          s = s.replace('const MAX_JOBS_PER_REFRESH = 5;', 'const MAX_JOBS_PER_REFRESH = 10;')

          old = '''Deno.serve(async request => {
  if (request.method !== "POST") {
    return new Response(JSON.stringify({ error: "POST required" }), { status: 405 });
  }

  const started = new Date().toISOString();
  let stage = "startup";

  try {
    stage = "irev-sync";
    const discovery = await invoke("irev-sync", { mode: "scheduled-refresh" });
    stage = "drain-ward-jobs";'''
          new = '''Deno.serve(async request => {
  if (request.method !== "POST") {
    return new Response(JSON.stringify({ error: "POST required" }), { status: 405 });
  }

  const started = new Date().toISOString();
  let stage = "startup";
  let requestBody: Record<string, unknown> = {};
  try {
    requestBody = await request.json();
  } catch {
    requestBody = {};
  }
  const mode = String(requestBody.mode ?? "scheduled-refresh");
  const shouldDiscover = mode !== "process-batch";

  try {
    let discovery: Record<string, unknown> = {
      discovered: 0,
      processed: 0,
      result_sheets_discovered: 0,
      elections: [],
      diagnostics: {},
    };

    if (shouldDiscover) {
      stage = "irev-sync";
      discovery = await invoke("irev-sync", { mode: "scheduled-refresh" });
    }

    stage = "drain-ward-jobs";'''
          if old not in s:
              raise SystemExit('refresh handler anchor not found')
          s = s.replace(old, new, 1)

          old_remaining = '''    const { count: remaining } = await supabase
      .from("result_processing_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    await supabase.from("pipeline_runs").insert({'''
          new_remaining = '''    const { count: remainingSheets } = await supabase
      .from("result_processing_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    const { count: remainingWardJobs } = await supabase
      .from("irev_ward_sync_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    const remaining = (remainingSheets ?? 0) + (remainingWardJobs ?? 0);

    await supabase.from("pipeline_runs").insert({'''
          if old_remaining not in s:
              raise SystemExit('remaining anchor not found')
          s = s.replace(old_remaining, new_remaining, 1)
          s = s.replace('''        jobs_remaining: remaining ?? 0,
        max_jobs_per_refresh: MAX_JOBS_PER_REFRESH,''', '''        jobs_remaining: remaining,
        ward_jobs_remaining: remainingWardJobs ?? 0,
        sheet_jobs_remaining: remainingSheets ?? 0,
        max_jobs_per_refresh: MAX_JOBS_PER_REFRESH,
        mode,''', 1)
          s = s.replace('''      remaining: remaining ?? 0,
      ward_jobs: wardJobs,''', '''      remaining,
      ward_jobs: wardJobs,
      mode,''', 1)
          refresh.write_text(s)

          ui = Path('src/components/PipelineRunner.tsx')
          ui.write_text('''import { CheckCircle2, Loader2, Play, XCircle } from "lucide-react";\nimport { useState } from "react";\nimport { supabase } from "../lib/supabase";\n\ninterface PipelineRunnerProps {}\ninterface SyncResponse { ok?: boolean; error?: string; discovered?: number; }\ninterface BatchResponse {\n  ok?: boolean;\n  error?: string;\n  discovered?: number;\n  queued?: number;\n  processed?: number;\n  failed?: number;\n  remaining?: number;\n  ward_jobs?: { processed?: number; failed?: number };\n  mode?: string;\n}\n\nexport function PipelineRunner(_props: PipelineRunnerProps) {\n  const [running, setRunning] = useState(false);\n  const [message, setMessage] = useState("");\n  const [error, setError] = useState(false);\n\n  async function post(path: string, body: unknown) {\n    const response = await fetch(path, {\n      method: "POST",\n      headers: { "Content-Type": "application/json" },\n      body: JSON.stringify(body),\n    });\n    const data = await response.json().catch(() => ({}));\n    if (!response.ok || !data?.ok) {\n      throw new Error(data?.error ?? `Request failed with HTTP ${response.status}.`);\n    }\n    return data as BatchResponse;\n  }\n\n  async function run(): Promise<void> {\n    setRunning(true); setError(false); setMessage("Discovering elections and queueing IReV wards…");\n    try {\n      if (!supabase) throw new Error("Supabase is not configured.");\n\n      const discovery = await post("/api/irev-sync", { mode: "discover" }) as SyncResponse;\n      setMessage(`Discovery complete — ${discovery.discovered ?? 0} elections found. Processing the queue in small batches…`);\n\n      let batchNumber = 0;\n      let remaining = Number.POSITIVE_INFINITY;\n      let totalWardProcessed = 0;\n      let totalSheetProcessed = 0;\n      let totalFailed = 0;\n\n      while (remaining > 0) {\n        batchNumber++;\n        const batch = await post("/api/irev-refresh", { mode: "process-batch" });\n        const wardProcessed = batch.ward_jobs?.processed ?? 0;\n        const sheetProcessed = batch.processed ?? 0;\n        totalWardProcessed += wardProcessed;\n        totalSheetProcessed += sheetProcessed;\n        totalFailed += batch.failed ?? 0;\n        remaining = batch.remaining ?? 0;\n\n        setMessage(\n          `Batch ${batchNumber}: ${wardProcessed} wards + ${sheetProcessed} result sheets processed. ` +\n          `${remaining} queued jobs remaining${totalFailed ? `, ${totalFailed} failed/retried` : ""}.`\n        );\n\n        if (wardProcessed === 0 && sheetProcessed === 0 && remaining > 0) {\n          throw new Error("The queue still contains jobs, but this batch made no progress. Check the pipeline logs before retrying.");\n        }\n      }\n\n      setMessage(`Pipeline complete — ${totalWardProcessed} ward jobs and ${totalSheetProcessed} result-sheet jobs processed.`);\n      setError(totalFailed > 0);\n    } catch (caught: unknown) {\n      setError(true); setMessage(caught instanceof Error ? caught.message : "The pipeline could not be completed.");\n    } finally { setRunning(false); }\n  }\n\n  return (\n    <div className="fixed bottom-4 left-4 z-40 sm:bottom-6 sm:left-6">\n      {message && <div className="mb-3 flex w-[min(24rem,calc(100vw-2rem))] items-start gap-3 rounded-2xl border border-zinc-800/60 bg-zinc-950/95 p-4 text-xs leading-5 text-zinc-300 shadow-2xl shadow-black/40 backdrop-blur-xl">\n        {error ? <XCircle className="mt-0.5 shrink-0 text-red-400" size={16} /> : !running ? <CheckCircle2 className="mt-0.5 shrink-0 text-emerald-400" size={16} /> : <Loader2 className="mt-0.5 shrink-0 animate-spin text-zinc-400" size={16} />}\n        <span>{message}</span>\n      </div>}\n      <button onClick={() => void run()} disabled={running} className="inline-flex items-center gap-2 rounded-xl border border-zinc-700/70 bg-zinc-100 px-4 py-2.5 text-sm font-semibold text-zinc-950 shadow-xl shadow-black/20 transition-all duration-200 ease-in-out hover:translate-y-[-1px] hover:bg-white disabled:cursor-not-allowed disabled:opacity-60">\n        {running ? <Loader2 className="animate-spin" size={16} /> : <Play size={16} />}{running ? "Running pipeline…" : "Run pipeline"}\n      </button>\n    </div>\n  );\n}\n''')

          api = Path('api/irev-refresh.js')
          api.write_text('''export default async function handler(req, res) {\n  if (req.method !== "POST") return res.status(405).json({ ok: false, error: "POST required" });\n\n  const base = (process.env.VITE_SUPABASE_URL || "").replace(/\\/$/, "");\n  const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY || "";\n  if (!base || !key) return res.status(500).json({ ok: false, error: "Supabase environment is not configured." });\n\n  try {\n    const response = await fetch(`${base}/functions/v1/irev-refresh`, {\n      method: "POST",\n      headers: {\n        apikey: key,\n        Authorization: `Bearer ${key}`,\n        "Content-Type": "application/json",\n        Accept: "application/json",\n      },\n      body: JSON.stringify(req.body ?? { mode: "process-batch" }),\n    });\n\n    const text = await response.text();\n    let body;\n    try { body = text ? JSON.parse(text) : null; } catch { body = { ok: false, error: text || `HTTP ${response.status}` }; }\n    return res.status(response.status).json(body);\n  } catch (error) {\n    return res.status(502).json({ ok: false, error: error instanceof Error ? error.message : String(error) });\n  }\n}\n''')

          workflow = Path('.github/workflows/one-shot-batched-pipeline.yml')
          s2 = workflow.read_text()
          workflow.unlink()

          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','supabase/functions/irev-refresh/index.ts','src/components/PipelineRunner.tsx','api/irev-refresh.js','.github/workflows/one-shot-batched-pipeline.yml'], check=True)
          subprocess.run(['git','commit','-m','fix: process IReV queue in resumable batches'], check=True)
          subprocess.run(['git','push'], check=True)
