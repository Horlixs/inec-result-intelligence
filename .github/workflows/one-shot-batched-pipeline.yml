name: One-shot batched pipeline patch

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'fix: process IReV queue in resumable batches')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch refresh worker and pipeline UI
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          refresh = Path('supabase/functions/irev-refresh/index.ts')
          s = refresh.read_text()
          s = s.replace('const MAX_JOBS_PER_REFRESH = 5;', 'const MAX_JOBS_PER_REFRESH = 10;')

          old = '''Deno.serve(async request => {
  if (request.method !== "POST") {
    return new Response(JSON.stringify({ error: "POST required" }), { status: 405 });
  }

  const started = new Date().toISOString();
  let stage = "startup";

  try {
    stage = "irev-sync";
    const discovery = await invoke("irev-sync", { mode: "scheduled-refresh" });
    stage = "drain-ward-jobs";'''
          new = '''Deno.serve(async request => {
  if (request.method !== "POST") {
    return new Response(JSON.stringify({ error: "POST required" }), { status: 405 });
  }

  const started = new Date().toISOString();
  let stage = "startup";
  let requestBody: Record<string, unknown> = {};
  try {
    requestBody = await request.json();
  } catch {
    requestBody = {};
  }
  const mode = String(requestBody.mode ?? "scheduled-refresh");
  const shouldDiscover = mode !== "process-batch";

  try {
    let discovery: Record<string, unknown> = {
      discovered: 0,
      processed: 0,
      result_sheets_discovered: 0,
      elections: [],
      diagnostics: {},
    };

    if (shouldDiscover) {
      stage = "irev-sync";
      discovery = await invoke("irev-sync", { mode: "scheduled-refresh" });
    }

    stage = "drain-ward-jobs";'''
          if old not in s:
              raise SystemExit('refresh handler anchor not found')
          s = s.replace(old, new, 1)

          old_remaining = '''    const { count: remaining } = await supabase
      .from("result_processing_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    await supabase.from("pipeline_runs").insert({'''
          new_remaining = '''    const { count: remainingSheets } = await supabase
      .from("result_processing_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    const { count: remainingWardJobs } = await supabase
      .from("irev_ward_sync_jobs")
      .select("id", { count: "exact", head: true })
      .in("status", ["queued", "processing"]);

    const remaining = (remainingSheets ?? 0) + (remainingWardJobs ?? 0);

    await supabase.from("pipeline_runs").insert({'''
          if old_remaining not in s:
              raise SystemExit('remaining anchor not found')
          s = s.replace(old_remaining, new_remaining, 1)
          s = s.replace('''        jobs_remaining: remaining ?? 0,
        max_jobs_per_refresh: MAX_JOBS_PER_REFRESH,''', '''        jobs_remaining: remaining,
        ward_jobs_remaining: remainingWardJobs ?? 0,
        sheet_jobs_remaining: remainingSheets ?? 0,
        max_jobs_per_refresh: MAX_JOBS_PER_REFRESH,
        mode,''', 1)
          s = s.replace('''      remaining: remaining ?? 0,
      ward_jobs: wardJobs,''', '''      remaining,
      ward_jobs: wardJobs,
      mode,''', 1)
          refresh.write_text(s)

          Path('src/components/PipelineRunner.tsx').write_text('''import { CheckCircle2, Loader2, Play, XCircle } from "lucide-react";
import { useState } from "react";
import { supabase } from "../lib/supabase";

interface PipelineRunnerProps {}
interface SyncResponse { ok?: boolean; error?: string; discovered?: number; }
interface BatchResponse {
  ok?: boolean;
  error?: string;
  discovered?: number;
  queued?: number;
  processed?: number;
  failed?: number;
  remaining?: number;
  ward_jobs?: { processed?: number; failed?: number };
  mode?: string;
}

export function PipelineRunner(_props: PipelineRunnerProps) {
  const [running, setRunning] = useState(false);
  const [message, setMessage] = useState("");
  const [error, setError] = useState(false);

  async function post(path: string, body: unknown) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data?.ok) {
      throw new Error(data?.error ?? `Request failed with HTTP ${response.status}.`);
    }
    return data as BatchResponse;
  }

  async function run(): Promise<void> {
    setRunning(true); setError(false); setMessage("Discovering elections and queueing IReV wards…");
    try {
      if (!supabase) throw new Error("Supabase is not configured.");

      const discovery = await post("/api/irev-sync", { mode: "discover" }) as SyncResponse;
      setMessage(`Discovery complete — ${discovery.discovered ?? 0} elections found. Processing the queue in small batches…`);

      let batchNumber = 0;
      let remaining = Number.POSITIVE_INFINITY;
      let totalWardProcessed = 0;
      let totalSheetProcessed = 0;
      let totalFailed = 0;

      while (remaining > 0) {
        batchNumber++;
        const batch = await post("/api/irev-refresh", { mode: "process-batch" });
        const wardProcessed = batch.ward_jobs?.processed ?? 0;
        const sheetProcessed = batch.processed ?? 0;
        totalWardProcessed += wardProcessed;
        totalSheetProcessed += sheetProcessed;
        totalFailed += batch.failed ?? 0;
        remaining = batch.remaining ?? 0;

        setMessage(
          `Batch ${batchNumber}: ${wardProcessed} wards + ${sheetProcessed} result sheets processed. ` +
          `${remaining} queued jobs remaining${totalFailed ? `, ${totalFailed} failed/retried` : ""}.`
        );

        if (wardProcessed === 0 && sheetProcessed === 0 && remaining > 0) {
          throw new Error("The queue still contains jobs, but this batch made no progress. Check the pipeline logs before retrying.");
        }
      }

      setMessage(`Pipeline complete — ${totalWardProcessed} ward jobs and ${totalSheetProcessed} result-sheet jobs processed.`);
      setError(totalFailed > 0);
    } catch (caught: unknown) {
      setError(true); setMessage(caught instanceof Error ? caught.message : "The pipeline could not be completed.");
    } finally { setRunning(false); }
  }

  return (
    <div className="fixed bottom-4 left-4 z-40 sm:bottom-6 sm:left-6">
      {message && <div className="mb-3 flex w-[min(24rem,calc(100vw-2rem))] items-start gap-3 rounded-2xl border border-zinc-800/60 bg-zinc-950/95 p-4 text-xs leading-5 text-zinc-300 shadow-2xl shadow-black/40 backdrop-blur-xl">
        {error ? <XCircle className="mt-0.5 shrink-0 text-red-400" size={16} /> : !running ? <CheckCircle2 className="mt-0.5 shrink-0 text-emerald-400" size={16} /> : <Loader2 className="mt-0.5 shrink-0 animate-spin text-zinc-400" size={16} />}
        <span>{message}</span>
      </div>}
      <button onClick={() => void run()} disabled={running} className="inline-flex items-center gap-2 rounded-xl border border-zinc-700/70 bg-zinc-100 px-4 py-2.5 text-sm font-semibold text-zinc-950 shadow-xl shadow-black/20 transition-all duration-200 ease-in-out hover:translate-y-[-1px] hover:bg-white disabled:cursor-not-allowed disabled:opacity-60">
        {running ? <Loader2 className="animate-spin" size={16} /> : <Play size={16} />}{running ? "Running pipeline…" : "Run pipeline"}
      </button>
    </div>
  );
}
''')

          Path('api/irev-refresh.js').write_text('''export default async function handler(req, res) {
  if (req.method !== "POST") return res.status(405).json({ ok: false, error: "POST required" });

  const base = (process.env.VITE_SUPABASE_URL || "").replace(/\/$/, "");
  const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY || "";
  if (!base || !key) return res.status(500).json({ ok: false, error: "Supabase environment is not configured." });

  try {
    const response = await fetch(`${base}/functions/v1/irev-refresh`, {
      method: "POST",
      headers: {
        apikey: key,
        Authorization: `Bearer ${key}`,
        "Content-Type": "application/json",
        Accept: "application/json",
      },
      body: JSON.stringify(req.body ?? { mode: "process-batch" }),
    });

    const text = await response.text();
    let body;
    try { body = text ? JSON.parse(text) : null; } catch { body = { ok: false, error: text || `HTTP ${response.status}` }; }
    return res.status(response.status).json(body);
  } catch (error) {
    return res.status(502).json({ ok: false, error: error instanceof Error ? error.message : String(error) });
  }
}
''')

