name: IReV Batch Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/irev-batch-smoke.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect processing state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/result_processing_jobs?select=id,result_sheet_id,status,attempts,last_error,updated_at&order=updated_at.desc&limit=10" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
