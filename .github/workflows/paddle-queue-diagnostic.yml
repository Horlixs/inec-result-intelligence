name: PaddleOCR Queue Diagnostics

on:
  push:
    paths:
      - ".github/workflows/paddle-queue-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Resolve Supabase service key
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Using configured service-role key."
          else
            test -n "$SUPABASE_ACCESS_TOKEN"
            test -n "$SUPABASE_PROJECT_ID"
            curl --fail --silent --show-error --location -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys" > /tmp/supabase-api-keys.json
            SERVICE_KEY="$(python3 -c 'import json; d=json.load(open("/tmp/supabase-api-keys.json")); keys=d if isinstance(d,list) else d.get("api_keys",d.get("keys",[])); print(next((x.get("api_key","") for x in keys if x.get("name")=="service_role" or x.get("type")=="secret"),""))')"
            test -n "$SERVICE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"
            echo "Resolved service-role key from the linked Supabase project."
          fi

      - name: Query live PaddleOCR queue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone

          base = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/result_processing_jobs"
          key = os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          now = datetime.now(timezone.utc)
          today = now.replace(hour=0, minute=0, second=0, microsecond=0).isoformat().replace("+00:00", "Z")
          cutoff = (now.timestamp() - 15 * 60)
          headers = {
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Prefer": "count=exact",
              "Range-Unit": "items",
              "Range": "0-0",
          }

          def query(params, range_header=None):
              h = dict(headers)
              if range_header:
                  h["Range"] = range_header
              url = base + "?" + urllib.parse.urlencode(params, safe=",:.*()")
              req = urllib.request.Request(url, headers=h, method="GET")
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read().decode("utf-8")
                  total = None
                  content_range = response.headers.get("Content-Range", "")
                  if "/" in content_range:
                      tail = content_range.rsplit("/", 1)[1]
                      if tail.isdigit():
                          total = int(tail)
                  return json.loads(body or "[]"), total

          def count_status(status, extra=None):
              params = {"select": "id", "engine": "eq.paddle", "status": "eq." + status}
              params.update(extra or {})
              _, total = query(params)
              return total

          def age_minutes(iso):
              if not iso:
                  return None
              try:
                  value = datetime.fromisoformat(iso.replace("Z", "+00:00"))
                  return round((now - value).total_seconds() / 60, 1)
              except Exception:
                  return None

          def classify(value):
              raw = str(value or "").strip()
              low = raw.lower()
              if not raw:
                  return None
              checks = [
                  ("maximum processing attempts reached after a stale worker lock", "stale_worker_lock_retry_exhausted"),
                  ("maximum processing attempts reached", "retry_limit_reached"),
                  ("gemini http 503", "gemini_unavailable"),
                  ("deadline expired before operation could complete", "gemini_unavailable"),
                  ("gemini http 429", "gemini_rate_limited"),
                  ("resource_exhausted", "gemini_rate_limited"),
                  ("http 504", "gateway_timeout"),
                  ("gateway timeout", "gateway_timeout"),
                  ("google_generative_ai_api_key is required", "gemini_key_missing"),
                  ("irev document collision", "source_document_collision"),
                  ("paddleocr returned no readable text", "ocr_no_readable_text"),
                  ("no queued paddleocr job", "queue_empty"),
              ]
              for needle, label in checks:
                  if needle in low:
                      return label
              safe = re.sub(r"https?://\S+", "[url]", raw)
              safe = re.sub(r"\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b", "[id]", safe, flags=re.I)
              return re.sub(r"\s+", " ", safe)[:140]

          processing, _ = query({
              "select": "attempts,locked_at,locked_by,last_error,updated_at",
              "engine": "eq.paddle", "status": "eq.processing",
              "order": "locked_at.asc.nullsfirst", "limit": "10",
          }, "0-9")
          failed, _ = query({
              "select": "attempts,last_error,updated_at",
              "engine": "eq.paddle", "status": "eq.failed",
              "updated_at": "gte." + today,
              "order": "updated_at.desc", "limit": "10",
          }, "0-9")
          completed, _ = query({
              "select": "completed_at",
              "engine": "eq.paddle", "status": "eq.completed",
              "completed_at": "gte." + today,
              "order": "completed_at.desc", "limit": "10",
          }, "0-9")

          rows = []
          stale = 0
          for item in processing:
              age = age_minutes(item.get("locked_at"))
              if age is None or age >= 15:
                  stale += 1
              owner = str(item.get("locked_by") or "")
              rows.append({
                  "lock_age_minutes": age,
                  "attempts": item.get("attempts"),
                  "owner": "manual-button" if owner.startswith("manual-button:") else ("paddle-worker" if owner.startswith("paddle-ocr:") else ("other" if owner else "none")),
                  "error": classify(item.get("last_error")),
                  "updated_at": item.get("updated_at"),
              })

          frontend_supabase_url = "https://rmcyccjnjxqcnqyvxnle.supabase.co"
          report = {
              "checked_at_utc": now.isoformat(),
              "frontend_database_matches_worker": os.environ["SUPABASE_URL"].rstrip("/") == frontend_supabase_url,
              "counts": {
                  "queued": count_status("queued"),
                  "processing_total": count_status("processing"),
                  "processing_stale_or_unlocked_sample_count": stale,
                  "completed_today_utc": count_status("completed", {"completed_at": "gte." + today}),
                  "failed_today_utc": count_status("failed", {"updated_at": "gte." + today}),
              },
              "processing_jobs_sample": rows,
              "failed_today_sample": [{
                  "attempts": item.get("attempts"),
                  "updated_at": item.get("updated_at"),
                  "error": classify(item.get("last_error")),
              } for item in failed],
              "completed_today_sample_count_max_10": len(completed),
          }
          print(json.dumps(report, ensure_ascii=False))
          PY
