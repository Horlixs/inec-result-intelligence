name: One-shot IReV CORS fix
on:
  push:
    paths:
      - .github/workflows/one-shot-irev-cors-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch irev-sync
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/irev-sync/index.ts')
          s=p.read_text()
          old='''function json(data: unknown, status = 200) {\n  return new Response(JSON.stringify(data), {\n    status,\n    headers: { "content-type": "application/json; charset=utf-8" },\n  });\n}'''
          new='''const CORS_HEADERS = {\n  "Access-Control-Allow-Origin": "https://inec-result-intelligence.vercel.app",\n  "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",\n  "Access-Control-Allow-Methods": "POST, OPTIONS",\n  "Access-Control-Max-Age": "86400",\n};\n\nfunction json(data: unknown, status = 200) {\n  return new Response(JSON.stringify(data), {\n    status,\n    headers: { ...CORS_HEADERS, "content-type": "application/json; charset=utf-8" },\n  });\n}'''
          if old not in s: raise SystemExit('json block not found')
          s=s.replace(old,new,1)
          marker='''Deno.serve(async request => {\n  const startedAt = new Date().toISOString();\n  if (request.method !== "POST") return json({ ok: false, error: "POST required" }, 405);'''
          replacement='''Deno.serve(async request => {\n  const startedAt = new Date().toISOString();\n  if (request.method === "OPTIONS") return new Response(null, { status: 204, headers: CORS_HEADERS });\n  if (request.method !== "POST") return json({ ok: false, error: "POST required" }, 405);'''
          if marker not in s: raise SystemExit('serve marker not found')
          p.write_text(s.replace(marker,replacement,1))
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/irev-sync/index.ts .github/workflows/one-shot-irev-cors-fix.yml
          git commit -m 'fix: add CORS handling to IReV sync'
          git push
