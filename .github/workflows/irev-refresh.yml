name: IReV Refresh

on:
  push:
    paths:
      - ".github/workflows/irev-refresh.yml"
  schedule:
    # Remote worker: refresh discovery/queue every 5 minutes without user activity.
    - cron: "2/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Supabase Edge Functions"]
    types: [completed]

concurrency:
  group: irev-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Trigger IReV refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

          FORCE_REFRESH=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            FORCE_REFRESH=true
          fi

          curl --fail-with-body --silent --show-error --max-time 140 \
            -X POST "$SUPABASE_URL/functions/v1/irev-refresh" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"trigger\":\"github-actions\",\"force\":$FORCE_REFRESH}"
