name: IReV Pipeline Verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/irev-pipeline-verification.yml"
  workflow_run:
    workflows: ["Deploy Supabase Edge Functions"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    steps:
      - name: Verify persisted pipeline state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"

          response=$(curl --fail-with-body --silent --show-error             -X POST "$SUPABASE_URL/functions/v1/irev-verify-pipeline"             -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY"             -H "apikey: $SUPABASE_PUBLISHABLE_KEY"             -H "Content-Type: application/json"             -d '{}')

          echo "$response"

          python3 - "$response" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if not data.get("ok"):
              raise SystemExit("Verification function failed: "+str(data.get("error")))
          c=data["counts"]
          print("COUNTS:",json.dumps(c,separators=(",",":")))
          if not all(c.get(k,0)>0 for k in ("processed_sheets","extractions","result_entries","validation_checks")):
              print("VERIFICATION_STATUS: NOT_YET_PROVEN")
              raise SystemExit(2)
          print("VERIFICATION_STATUS: OCR_EXTRACTION_PERSISTED")
          print("LATEST_SHEETS:",json.dumps(data.get("latest_sheets",[])[:10],separators=(",",":")))
          print("LATEST_EXTRACTION:",json.dumps(data.get("latest_extraction"),separators=(",",":")))
          print("LATEST_ENTRIES:",json.dumps(data.get("latest_entries",[])[:10],separators=(",",":")))
          print("LATEST_CHECKS:",json.dumps(data.get("latest_checks",[])[:10],separators=(",",":")))
          PY

