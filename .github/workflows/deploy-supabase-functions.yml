name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Gemini secret
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: supabase secrets set GOOGLE_GENERATIVE_AI_API_KEY="$GOOGLE_GENERATIVE_AI_API_KEY" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Report Gemini secret availability
        run: |
          if [ -n "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            echo "Gemini secret source: GitHub Actions secret is configured."
          else
            echo "Gemini secret source: GitHub Actions secret is not configured."
          fi
